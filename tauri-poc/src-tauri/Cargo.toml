[package]
name = "orca-tauri-poc"
version = "0.1.0"
description = "Isolated Tauri feasibility shell for Orca"
authors = ["stablyai"]
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.5.2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.1", features = [] }
base64 = "0.22"
tauri-plugin-clipboard-manager = "2.2.2"
tauri-plugin-dialog = "2.2.2"
tauri-plugin-opener = "2.2.7"

[features]
custom-protocol = ["tauri/custom-protocol"]
