[package]
name = "orca-tauri-poc"
version = "0.1.0"
description = "Isolated Tauri feasibility shell for Orca"
authors = ["stablyai"]
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.1", features = ["image-ico", "image-png", "tray-icon", "unstable"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
pbkdf2 = { version = "0.12", features = ["hmac"] }
getrandom = "0.3"
percent-encoding = "2"
libc = "0.2"
sha2 = "0.10"
sha1 = "0.10"
tauri-plugin-clipboard-manager = "2.2.2"
tauri-plugin-dialog = "2.2.2"
tauri-plugin-opener = "2.2.7"
tauri-plugin-notification = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.9.0"
url = "2"
trash = "5"
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "multipart",
  "rustls"
] }
tokio = { version = "1", features = ["sync", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
    "Win32_UI_Input_KeyboardAndMouse"
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[dev-dependencies]
tempfile = "3"
